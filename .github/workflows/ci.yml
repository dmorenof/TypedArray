name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, libxml, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      # Libraries do not commit composer.lock: resolve dev tools for each PHP version.
      - name: Install development dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

  static-analysis:
    name: PHPStan / PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Analyse source
        run: composer analyse

  coverage:
    name: Code coverage / PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Generate coverage report
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-filter src --coverage-clover coverage.xml --coverage-text
      - name: Enforce minimum code coverage
        run: php tools/check-coverage.php coverage.xml 95
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: phpunit-coverage-php84
          path: coverage.xml
          retention-days: 14
